<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23262D"/>
      <stop offset="1" stop-color="#0C0D10"/>
    </linearGradient>
    <linearGradient id="fg" gradientUnits="userSpaceOnUse" x1="0" y1="133" x2="0" y2="891">
      <stop offset="0" stop-color="{{TOP}}"/>
      <stop offset="1" stop-color="{{BOTTOM}}"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="{{BOTTOM}}" stop-opacity="0.22"/>
      <stop offset="1" stop-color="{{BOTTOM}}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="tile">
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  </g>
  <!-- The dish: half of Orbit's ring (the half opposite its gap) with the feed where Orbit's satellite
       sits, sized to the Warhound brief: span 74% (758 px), strokes 103 px (10%), knob 130 px across,
       centred on the canvas. Dish centre (560.3, 463.7), radius 375.8; feed at -45 degrees. -->
  <g id="mark">
  <path d="M 826.0 729.4 A 375.8 375.8 0 0 1 294.6 198.0" fill="none" stroke="url(#fg)" stroke-width="103" stroke-linecap="round"/>
  <path d="M 560.3 463.7 L 826.0 198.0" fill="none" stroke="url(#fg)" stroke-width="103" stroke-linecap="round"/>
  <circle cx="826.0" cy="198.0" r="65" fill="url(#fg)"/>
  </g>
</svg>
