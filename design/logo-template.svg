<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23262D"/>
      <stop offset="1" stop-color="#0C0D10"/>
    </linearGradient>
    <linearGradient id="fg" gradientUnits="userSpaceOnUse" x1="0" y1="216" x2="0" y2="808">
      <stop offset="0" stop-color="{{TOP}}"/>
      <stop offset="1" stop-color="{{BOTTOM}}"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="{{BOTTOM}}" stop-opacity="0.22"/>
      <stop offset="1" stop-color="{{BOTTOM}}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- The dish: Orbit's ring (centre 512, r 250, stroke 92) with only the half opposite its gap,
       an arm, and the feed dot exactly where Orbit's satellite sits (689, 335, r 58). -->
  <path d="M 688.8 688.8 A 250 250 0 0 1 335.2 335.2" fill="none" stroke="url(#fg)" stroke-width="92" stroke-linecap="round"/>
  <path d="M 512 512 L 650.6 373.4" fill="none" stroke="url(#fg)" stroke-width="44" stroke-linecap="round"/>
  <circle cx="689" cy="335" r="58" fill="url(#fg)"/>
</svg>
