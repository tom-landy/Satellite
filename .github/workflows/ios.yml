name: iOS build

on:
  # Every branch builds on push while Satellite is young. Mac minutes are free on public repos.
  push:
    paths:
      - "Satellite/**"
      - "Satellite.xcodeproj/**"
      - "Satellite-Info.plist"
      - "tools/feedtest/**"
      - "tools/feedcheck/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      screenshots:
        description: Take simulator screenshots and commit them to docs/screenshots (about 10 Mac minutes)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode 26 or later
        run: |
          # App Store Connect only accepts builds made with the iOS 26 SDK or later.
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 or later on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Feed tests (offline)
        timeout-minutes: 8
        run: |
          swiftc Satellite/FeedKit/*.swift tools/feedtest/main.swift -o /tmp/feedtest
          /tmp/feedtest tools/feedtest/fixtures
      - name: Build for simulator
        run: |
          xcodebuild \
            -project Satellite.xcodeproj \
            -target Satellite \
            -sdk iphonesimulator \
            -configuration Debug \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build > ios-build.log 2>&1 || true
          grep -E "error:|warning: .*Satellite/|BUILD (SUCCEEDED|FAILED)" ios-build.log || true
          grep -q "BUILD SUCCEEDED" ios-build.log
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build.log
      - name: Feed check (live feeds)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          swiftc -O Satellite/FeedKit/*.swift tools/feedcheck/main.swift -o /tmp/feedcheck
          /tmp/feedcheck tools/feedcheck/feeds.opml
      - name: Screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        timeout-minutes: 20
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          phones=[x for r in d if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")]
          pro=[x for x in phones if "Pro" in x["name"] and "Max" not in x["name"]]
          print((pro or phones)[-1]["udid"])')
          echo "Using $UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/Satellite.app
          mkdir -p docs/screenshots
          cd docs/screenshots
          shoot() {
            xcrun simctl terminate "$UDID" com.warhound.satellite 2>/dev/null || true
            xcrun simctl launch "$UDID" com.warhound.satellite -demo "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "$NAME.png"
          }
          NAME=1-reader shoot -appearance dark
          NAME=2-reader-light shoot -appearance light
          NAME=3-code shoot -demoIndex 3 -appearance dark
          NAME=4-caught-up shoot -demoEnd YES -appearance dark
          NAME=5-sources shoot -demoSheet sources -appearance dark
          NAME=6-settings shoot -demoSheet settings -appearance light -accentTheme teal
          NAME=7-serif-violet shoot -demoIndex 1 -readerTypeface serif -accentTheme violet -appearance light
          NAME=8-welcome shoot -demoWelcome YES -appearance system
          NAME=9-add shoot -demoSheet addSource -appearance dark
          NAME=10-list shoot -demoSheet articles -appearance dark
          NAME=11-list-light shoot -demoSheet articles -appearance light -accentTheme orange
          xcrun simctl terminate "$UDID" com.warhound.satellite || true
          xcrun simctl launch "$UDID" com.warhound.satellite -appearanceChosen YES
          sleep 5
          xcrun simctl io "$UDID" screenshot 0-empty.png
          sips --resampleWidth 590 *.png >/dev/null
      - name: Upload screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
      - name: Commit screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update screenshots [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
